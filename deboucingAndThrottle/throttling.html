<!DOCTYPE html>
<body>
    <input type="text" id="searchBar"/ placeholder="SearchBox">
    <button type="button" id="send">Send</button>
    

</body>
<script>
    function getData(data){
        console.log(data);
    }

    function throttle(fn , delay){
    let lastCall = 0;
    return function(...arg){
        const now = Date.now();
        if(now - lastCall < delay){
            return;
        }

        lastCall = now;
        return fn(...arg);
    };
}

    let sendButton =  document.getElementById('send');

    sendButton.addEventListener('click',throttle(() => {
            // Get the CURRENT value from the input inside the function
            const currentVal = document.getElementById('searchBar').value;
            getData(currentVal);
        }, 9000));
</script>
</html>
