<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Debouncing Example</title>
</head>
<body>
    <h2>Search With Debounce</h2>

    <input type="text" id="searchBox" placeholder="Type to search..." />

    <p id="result"></p>

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        // --- Debounce Function ---
        function debounce(func, delay) {
            let timer;
            return function (...args) {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    func.apply(this, args);
                }, delay);
            };
        }

        // --- Function to Call API ---
        async function searchQuery(query) {
            if (!query) {
                document.getElementById("result").textContent = "";
                return;
            }

            try {
                const res = await axios.get(`http://localhost:3000/search?q=${query}`);
                document.getElementById("result").textContent = res.data.message;
            } catch (err) {
                console.error(err);
            }
        }

        // Attach debounced function to input box
        const searchBox = document.getElementById("searchBox");
        searchBox.addEventListener("keyup", debounce(() => {
            searchQuery(searchBox.value);
        }, 1000)); // 500ms debounce delay
    </script>
</body>
</html>
